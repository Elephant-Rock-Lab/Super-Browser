<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Form Page</title></head>
<body>
  <h1>Form Benchmark Fixture</h1>
  <form id="test-form" onsubmit="event.preventDefault()">
    <label for="input-1">Field 1</label>
    <input id="input-1" type="text" name="field1" placeholder="Enter text">
    <label for="input-2">Field 2</label>
    <input id="input-2" type="text" name="field2" placeholder="Enter text">
    <label for="input-3">Field 3</label>
    <input id="input-3" type="email" name="field3" placeholder="user@example.com">
    <label for="input-4">Field 4</label>
    <input id="input-4" type="password" name="field4">
    <label for="input-5">Field 5</label>
    <input id="input-5" type="text" name="field5">
    <label for="input-6">Field 6</label>
    <input id="input-6" type="text" name="field6">
    <label for="input-7">Field 7</label>
    <input id="input-7" type="number" name="field7">
    <label for="input-8">Field 8</label>
    <input id="input-8" type="text" name="field8">
    <label for="input-9">Field 9</label>
    <input id="input-9" type="text" name="field9">
    <label for="input-10">Field 10</label>
    <input id="input-10" type="text" name="field10">

    <label for="select-1">Select</label>
    <select id="select-1" name="option">
      <option value="a">Option A</option>
      <option value="b">Option B</option>
      <option value="c">Option C</option>
    </select>

    <label for="textarea-1">Textarea</label>
    <textarea id="textarea-1" name="comments" rows="4"></textarea>

    <button id="submit-button" type="button">Submit</button>
  </form>
</body>
</html>
