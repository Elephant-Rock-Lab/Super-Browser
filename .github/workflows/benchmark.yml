name: Benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per metric"
        required: false
        default: "5"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with patchright
        run: pip install -e ".[dev,patchright]"

      - name: Install browser
        run: python -m patchright install chromium

      - name: Install OS deps for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libatspi2.0-0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Run benchmark
        run: |
          python scripts/browser_benchmark.py \
            --fixtures benchmarks/fixtures \
            --out-dir benchmarks/results \
            --iterations ${{ github.event.inputs.iterations }} \
            --warmup 1

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 90
