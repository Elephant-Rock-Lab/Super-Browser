name: Adversarial v3 Tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/adversarial_v3/**'
  pull_request:
    paths:
      - 'tests/adversarial_v3/**'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Browser backend for real-browser run'
        required: false
        default: 'stub'
        type: choice
        options:
          - stub
          - playwright
          - superbrowser

jobs:
  # --- Offline structural tests (always run, merge gate) ---
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: pip install pytest pytest-asyncio
      - name: Run offline adversarial v3 suite
        working-directory: tests/adversarial_v3
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short
      - name: Verify stub produces no fabricated evidence
        working-directory: tests/adversarial_v3
        run: |
          PYTHONPATH=. python -c "
          import subprocess, json, sys, tempfile, os
          out = tempfile.mkdtemp()
          r = subprocess.run(
              [sys.executable, 'run.py', '--all', '--backend', 'stub', '--output-dir', out],
              capture_output=True, text=True
          )
          # Always surface subprocess output + report contents so any
          # assertion failure is diagnosable. Previously capture_output
          # hid run.py's stdout/stderr, leaving only a bare AssertionError.
          print('=== run.py return code:', r.returncode, flush=True)
          print('=== run.py STDOUT ===', flush=True)
          print(r.stdout, flush=True)
          print('=== run.py STDERR ===', flush=True)
          print(r.stderr, flush=True)
          reports = [f for f in os.listdir(out) if f.endswith('.json')]
          print('=== report files:', reports, flush=True)
          assert r.returncode == 0, f'Stub run should exit 0, got {r.returncode}'
          # The harness writes two JSON files: the run report and
          # adversarial-history.json (the trend log). Select only the
          # per-run report; asserting on all *.json matched the history
          # file too and failed with "Expected 1 report, got 2".
          reports = [f for f in reports if f != 'adversarial-history.json']
          assert len(reports) == 1, f'Expected 1 report, got {len(reports)}: {reports}'
          with open(os.path.join(out, reports[0])) as f:
              data = json.load(f)
          clean = [r for r in data['results'] if r['verdict'] == 'clean']
          flagged = [r for r in data['results'] if r['verdict'] == 'flagged']
          print('=== verdicts:', [(r['vector_id'], r['verdict']) for r in data['results']], flush=True)
          assert len(clean) == 0, f'Stub should not produce CLEAN, got {len(clean)}: {[r[\"vector_id\"] for r in clean]}'
          assert len(flagged) == 0, f'Stub should not produce FLAGGED, got {len(flagged)}: {[r[\"vector_id\"] for r in flagged]}'
          print(f'Stub honesty verified: 0 CLEAN, 0 FLAGGED, exit 0')
          "

  # --- Real-browser validation (manual dispatch only) ---
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install playwright pytest pytest-asyncio
          python -m playwright install --with-deps chromium
      - name: Install SuperBrowser (for superbrowser backend)
        if: github.event.inputs.backend == 'superbrowser'
        run: |
          # Install the SDK from the checked-out repository, NOT from PyPI.
          # `pip install superbrowser-sdk[all]` would validate the published
          # package while the PR's src/ tree went unimported — a false
          # certification. `.[all]` installs the code under review.
          pip install '.[all]'
          python -m patchright install --with-deps chromium
      - name: Run controlled tier
        # Diagnostic only. run.py exits non-zero on any CRITICAL+FLAGGED
        # verdict — which is the *expected* outcome on a bare CI runner
        # with headless Chromium (the detection tool is doing its job).
        # A flag here means detection worked, not that the harness broke.
        # We capture the report but do not let it fail the job; the
        # smoke-test step below is the actual wiring gate.
        continue-on-error: true
        working-directory: tests/adversarial_v3
        run: |
          PYTHONPATH=. python run.py \
            --tier controlled \
            --backend ${{ github.event.inputs.backend }} \
            --output-dir /tmp/adv3-reports
      - name: Run internal vectors
        # Same rationale as the controlled tier: diagnostic capture.
        continue-on-error: true
        working-directory: tests/adversarial_v3
        run: |
          PYTHONPATH=. python run.py \
            --tier fingerprint --tier automation --tier ejector --tier network --tier controlled \
            --backend ${{ github.event.inputs.backend }} \
            --output-dir /tmp/adv3-reports
      - name: Run SuperBrowser backend smoke tests
        # The real-backend merge gate. SB_AD3_SMOKE=1 un-skips the 8
        # tests in test_superbrowser_backend.py that instantiate
        # SuperBrowserBackend against the checked-out SDK. These catch
        # constructor/lifecycle/evaluate drift. Unlike the diagnostic
        # tiers above, THIS step is allowed to fail the job — it tests
        # backend wiring, not stealth outcome.
        if: github.event.inputs.backend == 'superbrowser'
        working-directory: tests/adversarial_v3
        env:
          SB_AD3_SMOKE: '1'
        run: |
          PYTHONPATH=.:../../src python -m pytest tests/test_superbrowser_backend.py -v --tb=short
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-v3-reports
          path: /tmp/adv3-reports/
