name: Adversarial Stealth Validation

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier(s) to run"
        required: true
        default: "tier3"
        type: choice
        options:
          - tier3
          - tier1
          - tier2
          - all
      run_id:
        description: "Custom run ID (optional)"
        required: false
        type: string

concurrency:
  group: adversarial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all] || pip install -e .
          pip install pytest pytest-asyncio

      - name: Run adversarial harness
        env:
          SB_ADV: ${{ inputs.tier == 'tier1' || inputs.tier == 'all' && '1' || '0' }}
          SB_ADV_VENDORS: ${{ inputs.tier == 'tier2' || inputs.tier == 'all' && '1' || '0' }}
          SB_ADV_VENDORS_ACK: ${{ inputs.tier == 'tier2' || inputs.tier == 'all' && '1' || '0' }}
          SB_ADV_REPORT_DIR: adversarial-results
        run: |
          python scripts/adversarial_run.py             --tier ${{ inputs.tier }}             --output adversarial-results/report.json             --markdown adversarial-results/report.md             --history adversarial-results/adversarial-history.json             ${{ inputs.run_id && format('--run-id {0}', inputs.run_id) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-report-${{ github.run_id }}
          path: adversarial-results/

      - name: Comment PR (if triggered from PR)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tier != 'tier3'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('adversarial-results/report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Adversarial Stealth Validation Report

${md}`
            });
