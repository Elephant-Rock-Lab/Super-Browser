[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-browser"
version = "1.2.0"
description = "Production-grade AI browser automation with built-in safety, stealth, and budget governance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Super Browser Team" },
]
keywords = [
    "browser-automation",
    "ai-agent",
    "web-scraping",
    "playwright",
    "stealth",
    "budget-governance",
    "safety",
    "anti-detection",
    "llm",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.scripts]
super-browser = "super_browser.cli:main"

[project.optional-dependencies]
browser = [
    "patchright>=1.0",
    "psutil>=5.9",
    "Pillow>=10.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.0",
]
security = [
    "cryptography>=42.0",
]
mcp = [
    "mcp>=1.0",
]
cloud = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real browser (deselect with '-m \"not integration\"')",
    "live: tests requiring a real browser AND real LLM API (excluded from CI)",
    "live_stealth: tests requiring live detection sites (excluded from CI)",
]
