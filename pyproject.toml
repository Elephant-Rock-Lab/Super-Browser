[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-browser"
version = "0.1.0"
description = "Comprehensive browser control for AI agents"
requires-python = ">=3.11"

[project.optional-dependencies]
browser = [
    "patchright>=1.0",
    "psutil>=5.9",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real browser (deselect with '-m \"not integration\"')",
]
