[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-browser"
version = "1.9.2"
description = "Anti-detection agent browser SDK — stealth, budget governance, security guardrails, and structured error recovery behind one async facade"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Super Browser Contributors" },
]
keywords = [
    "browser-automation",
    "ai-agent",
    "web-scraping",
    "playwright",
    "stealth",
    "budget-governance",
    "safety",
    "anti-detection",
    "llm",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.scripts]
super-browser = "super_browser.cli:main"

[project.urls]
Homepage = "https://github.com/super-browser/super-browser"
Documentation = "https://super-browser.readthedocs.io"
Changelog = "https://github.com/super-browser/super-browser/blob/main/CHANGELOG.md"
Repository = "https://github.com/super-browser/super-browser"
Issues = "https://github.com/super-browser/super-browser/issues"

[project.optional-dependencies]
patchright = [
    "patchright>=1.0",
    "psutil>=5.9",
    "Pillow>=10.0",
]
playwright = [
    "playwright>=1.40",
]
selenium = [
    "selenium>=4.0",
    "webdriver-manager>=4.0",
]
cdp = [
    "websockets>=12.0",
]
browser = [
    "patchright>=1.0",
    "psutil>=5.9",
    "Pillow>=10.0",
]
all = [
    "super-browser[patchright,playwright,selenium,cdp]",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.0",
    "twine>=5.0",
]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.0",
]
security = [
    "cryptography>=42.0",
]
mcp = [
    "mcp>=1.0",
]
cloud = [
    "httpx>=0.27",
]
cloak = [
    "cloakbrowser>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real browser (deselect with '-m \"not integration\"')",
    "live: tests requiring a real browser AND real LLM API (excluded from CI)",
    "live_stealth: tests requiring live detection sites (excluded from CI)",
    "flaky: tests that may fail intermittently due to timing or environment",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
[[tool.mypy.overrides]]
module = "patchright.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["super_browser"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]
