[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "super-browser"
version = "1.1.0"
description = "Comprehensive browser control for AI agents"
requires-python = ">=3.11"

[project.optional-dependencies]
browser = [
    "patchright>=1.0",
    "psutil>=5.9",
    "Pillow>=10.0",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
anthropic = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.0",
]
security = [
    "cryptography>=42.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/super_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a real browser (deselect with '-m \"not integration\"')",
    "live: tests requiring a real browser AND real LLM API (excluded from CI)",
    "live_stealth: tests requiring live detection sites (excluded from CI)",
]
